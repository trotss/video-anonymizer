<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelador de Caras y Audio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pixelador de Caras</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="video">Selecciona el vídeo:</label>
            <input type="file" name="video" id="video" accept="video/*" required>
        </div>
        
        <div class="form-group">
            <label for="max_faces">Número máximo de caras a pixelar:</label>
            <input type="number" name="max_faces" id="max_faces" value="1" min="-1" required>
            <div class="hint">Usa -1 para pixelar todas las caras detectadas.</div>
        </div>

        <div class="form-group">
            <label for="audio_mode">Tratamiento del audio:</label>
            <select name="audio_mode" id="audio_mode">
                <option value="keep">Mantener audio original</option>
                <option value="pitch">Distorsionar voz (Anonimizar tono grave)</option>
                <option value="mute">Eliminar audio por completo (Muto)</option>
            </select>
        </div>

        <button type="submit">Procesar y Descargar</button>
    </form>
</div>

</body>
</html>
